# Builds the mod on every push. The finished .jar is attached to each run
# under "Artifacts" on the Actions tab.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: cache gradle downloads
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build || (echo "Retrying once in 60s (downloads can be rate-limited)" && sleep 60 && ./gradlew build)
      - name: upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: unstable-story-mode
          path: build/libs/
